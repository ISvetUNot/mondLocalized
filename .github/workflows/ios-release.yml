name: build and release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release-latest-stable
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install xcpretty
        run: sudo gem install xcpretty

      - name: build
        run: |
          set -euo pipefail
          xcodebuild \
            -project mond.xcodeproj \
            -scheme mond \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

          rm -rf Payload mondL.ipa
          mkdir -p Payload

          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          cp -R "$APP_PATH" Payload/

          ditto -c -k --keepParent Payload mondL.ipa
          rm -rf Payload

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="latest-stable"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          NOTES="$(git log -5 --pretty=format:'- %h %s')"

          gh release create "$TAG" mondL.ipa \
            --target "${GITHUB_SHA}" \
            --title "Latest Stable" \
            --latest \
            --notes "automated build from ${GITHUB_SHA}

          ${NOTES}"
